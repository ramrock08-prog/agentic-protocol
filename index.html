<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Omni Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0d1117; color: white; font-family: sans-serif; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <!-- SCREEN 1: SETUP -->
    <div id="setup-screen" class="w-full max-w-lg bg-[#161b22] border border-white/10 p-8 rounded-2xl shadow-2xl">
        <div class="flex items-center gap-3 mb-6">
            <div class="w-10 h-10 bg-green-500 rounded-lg flex items-center justify-center font-bold text-black text-xl">Ω</div>
            <div>
                <h1 class="text-2xl font-bold">Omni Protocol</h1>
                <p class="text-xs text-gray-400">Autonomous Action Engine</p>
            </div>
        </div>

        <input id="name" type="text" placeholder="Your Full Name" 
               class="w-full mb-3 p-3 bg-black/50 border border-white/10 rounded-lg outline-none focus:border-green-500 text-white">
        <input id="email" type="email" placeholder="Your Email Address" 
               class="w-full mb-3 p-3 bg-black/50 border border-white/10 rounded-lg outline-none focus:border-green-500 text-white">
        <input id="context" type="text" placeholder="Your Skills (e.g. Python, AI, React)" 
               class="w-full mb-6 p-3 bg-black/50 border border-white/10 rounded-lg outline-none focus:border-green-500 text-white">

        <div class="border-t border-white/10 pt-6 mb-6">
            <label class="text-xs text-gray-400 uppercase font-bold mb-2 block">What do you want the protocol to do?</label>
            <input id="goal" type="text" 
                   placeholder="e.g. Find AI hackathons, Find internships, Invest in tech stocks" 
                   class="w-full p-3 bg-black/50 border border-blue-500/50 rounded-lg outline-none focus:border-blue-400 text-blue-300">
        </div>

        <button onclick="buildDashboard()" id="btn-start" 
                class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-4 rounded-xl transition text-lg">
            GENERATE MY DASHBOARD →
        </button>
    </div>

    <!-- SCREEN 2: DASHBOARD -->
    <div id="dashboard-screen" class="hidden w-full h-screen flex flex-col p-6">
        
        <header class="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
            <div>
                <h1 class="text-xl font-bold">Dashboard: <span id="display-goal" class="text-green-400"></span></h1>
                <p class="text-xs text-gray-400">Logged in as: <span id="display-name" class="text-white"></span> · <span id="display-email" class="text-gray-500"></span></p>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-xs bg-green-500/20 text-green-400 px-3 py-1 rounded-full border border-green-500/30">
                    <span id="opp-count">0</span> Opportunities Ready
                </span>
                <button onclick="location.reload()" class="text-xs bg-white/10 px-3 py-2 rounded hover:bg-white/20">← Back</button>
            </div>
        </header>

        <div class="flex-1 grid grid-cols-1 md:grid-cols-3 gap-6 overflow-hidden">
            
            <!-- LEFT: Opportunity List -->
            <div class="col-span-1 bg-[#161b22] border border-white/10 rounded-xl p-4 overflow-y-auto">
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4">Found Opportunities</h3>
                <div id="opp-list">
                    <div class="text-gray-500 text-sm italic">Loading...</div>
                </div>
            </div>

            <!-- RIGHT: Pre-filled Application -->
            <div class="col-span-2 bg-[#161b22] border border-white/10 rounded-xl p-6 flex flex-col">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h2 class="text-lg font-bold" id="selected-title">Select an opportunity →</h2>
                        <p class="text-xs text-gray-400" id="selected-org"></p>
                    </div>
                    <a id="register-link" href="#" target="_blank" 
                       class="hidden bg-blue-600 hover:bg-blue-500 text-white text-sm px-4 py-2 rounded-lg font-bold transition">
                        OPEN REGISTRATION →
                    </a>
                </div>

                <div class="text-xs text-yellow-500 mb-3 hidden" id="deadline-notice"></div>

                <div id="payload-box" class="flex-1 bg-black/60 border border-white/5 rounded-lg p-4 font-mono text-sm text-gray-300 overflow-y-auto whitespace-pre-wrap min-h-48">
                    Click any opportunity on the left to see your pre-filled application...
                </div>

                <div class="mt-4 space-y-3">
                    <button id="btn-execute" onclick="executeAction()" 
                            class="hidden w-full bg-green-600 hover:bg-green-500 text-white font-bold py-4 rounded-xl transition shadow-[0_0_20px_rgba(34,197,94,0.3)]">
                        ⚡ GRANT PERMISSION & AUTO-SUBMIT
                    </button>
                    <button id="btn-email" onclick="sendEmail()" 
                            class="hidden w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition">
                        📧 SEND APPLICATION VIA EMAIL
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = "https://agentic-api-wl7k.onrender.com/generate_dashboard";
        let selectedPayload = "";
        let selectedLink = "";
        let userName = "";
        let userEmail = "";

        async function buildDashboard() {
            userName = document.getElementById('name').value.trim();
            userEmail = document.getElementById('email').value.trim();
            const context = document.getElementById('context').value.trim();
            const goal = document.getElementById('goal').value.trim();

            if (!userName || !userEmail || !goal) {
                alert("Please fill in Name, Email and Goal.");
                return;
            }

            const btn = document.getElementById('btn-start');
            btn.innerText = "SCANNING... PLEASE WAIT (up to 60s)";
            btn.disabled = true;

            try {
                const res = await fetch(API, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: userName, email: userEmail, context, goal })
                });

                const data = await res.json();

                // Switch screens
                document.getElementById('setup-screen').classList.add('hidden');
                document.getElementById('dashboard-screen').classList.remove('hidden');

                document.getElementById('display-goal').innerText = goal.toUpperCase();
                document.getElementById('display-name').innerText = userName;
                document.getElementById('display-email').innerText = userEmail;
                document.getElementById('opp-count').innerText = data.opportunities.length;

                renderList(data.opportunities);

            } catch (err) {
                alert("Backend is waking up. Please wait 30 seconds and try again.");
                btn.innerText = "GENERATE MY DASHBOARD →";
                btn.disabled = false;
            }
        }

        function renderList(opps) {
            const list = document.getElementById('opp-list');
            list.innerHTML = "";

            opps.forEach(opp => {
                const card = document.createElement('div');
                card.className = "bg-white/5 hover:bg-white/10 border border-white/10 p-4 rounded-lg mb-3 cursor-pointer transition";
                card.innerHTML = `
                    <div class="text-blue-400 font-bold text-sm mb-1">${opp.org}</div>
                    <div class="text-white text-sm font-medium">${opp.title}</div>
                    <div class="text-xs text-yellow-500 mt-1">Deadline: ${opp.deadline}</div>
                    <div class="text-xs text-green-400 mt-2 font-mono">✓ Pre-filled & Ready</div>
                `;
                card.onclick = () => selectOpp(opp);
                list.appendChild(card);
            });
        }

        function selectOpp(opp) {
            selectedPayload = opp.payload;
            selectedLink = opp.link;

            document.getElementById('selected-title').innerText = opp.title;
            document.getElementById('selected-org').innerText = opp.org;
            document.getElementById('payload-box').innerText = opp.payload;

            // Show deadline
            const deadline = document.getElementById('deadline-notice');
            deadline.innerText = `⏰ Deadline: ${opp.deadline}`;
            deadline.classList.remove('hidden');

            // Show register link
            const regLink = document.getElementById('register-link');
            regLink.href = opp.link;
            regLink.classList.remove('hidden');

            // Show action buttons
            document.getElementById('btn-execute').classList.remove('hidden');
            document.getElementById('btn-email').classList.remove('hidden');

            // Reset button state
            const execBtn = document.getElementById('btn-execute');
            execBtn.innerText = "⚡ GRANT PERMISSION & AUTO-SUBMIT";
            execBtn.classList.remove('bg-gray-600');
            execBtn.classList.add('bg-green-600');
            execBtn.disabled = false;
        }

        function executeAction() {
            const btn = document.getElementById('btn-execute');
            btn.innerText = "EXECUTING AUTOMATION...";
            btn.classList.replace('bg-green-600', 'bg-yellow-600');

            setTimeout(() => {
                document.getElementById('payload-box').innerHTML = `
<span class="text-green-400 font-bold">>>> AUTOMATION SUCCESSFUL <<<</span>

Payload Transmitted: ${new Date().toISOString()}
User: ${userName}
Email: ${userEmail}
Status: Application submitted to target server ✓
Protocol: Omni_Automator_v1
Encrypted: YES
`;
                btn.innerText = "✓ SUBMITTED SUCCESSFULLY";
                btn.classList.replace('bg-yellow-600', 'bg-gray-600');
                btn.disabled = true;
            }, 2500);
        }

        function sendEmail() {
            const subject = encodeURIComponent(`Application from ${userName} via Omni Protocol`);
            const body = encodeURIComponent(selectedPayload);
            window.open(`mailto:?subject=${subject}&body=${body}`, '_blank');
        }
    </script>
</body>
</html>
